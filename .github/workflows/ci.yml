name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  id-token: write  # write permission is required to fetch OIDC tokens
  pull-requests: write

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - uses: ariga/setup-atlas@v0
            - name: pip install
              run: |
                pip install -r SRC/service_app/requirements.txt
            - name: flake8
              working-directory: ./SRC/service_app
              run: |
                flake8 backend
            - uses: docker/setup-buildx-action@v3
            - name: docker build
              uses: docker/build-push-action@v6
              with:
                context: ./SRC/service_app/backend
                load: true
                tags: backend:latest
            - name: test
              run: |
                pytest ./SRC/service_App/backend_test --order-dependencies

