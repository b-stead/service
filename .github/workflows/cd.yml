name: CD
on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  id-token: write

env:
  REGISTRY: servicedevmobile.azurecr.io
  PROJECT_NAME: service
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name servicedevmobile

      - name: Build images using docker-compose
        working-directory: .

        run: |
          docker compose -f backend/compose.yaml build frontend backend

      - name: Tag and push frontend image
        run: |
          docker tag src-frontend:latest ${{ env.REGISTRY }}/frontend:${{ github.run_id }}-${{ github.run_number }}
          docker push ${{ env.REGISTRY }}/frontend:${{ github.run_id }}-${{ github.run_number }}
        
      - name: Tag and push backend image
        run: |
          docker tag src-backend:latest ${{ env.REGISTRY }}/backend:${{ github.run_id }}-${{ github.run_number }}
          docker push ${{ env.REGISTRY }}/backend:${{ github.run_id }}-${{ github.run_number }}