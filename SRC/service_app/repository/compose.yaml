services:
  backend-db:
    image: postgres:16
    container_name: backend-db
    command:
    - -c
    - log_connections=true
    restart: always
    shm_size: 256mb
    ports:
    - '5432:5432'
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USERNAME: postgres
      POSTGRES_DATABASE: postgres
    networks:
      - app-network